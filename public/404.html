<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found | MENVIA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f7f7f5; color: #171717;
      font-family: Arial, Helvetica, sans-serif; text-align: center;
    }
    main { max-width: 520px; }
    .code { font-size: clamp(72px, 16vw, 120px); font-weight: 800; line-height: 1; }
    h1 { font-size: 26px; margin: 20px 0 10px; }
    p { color: #666; line-height: 1.6; }
    a {
      display: inline-block; margin-top: 18px; padding: 14px 24px;
      background: #171717; color: white; text-decoration: none;
      font-size: 13px; font-weight: 700; letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>PAGE NOT FOUND</h1>
    <p>The page you're looking for may have moved or no longer exists.</p>
    <a href="/">BACK TO HOME</a>
  </main>
</body>
</html>
